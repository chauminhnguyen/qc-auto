apps:
  speedtest:
    app_id: org.zwanoo.android.speedtest
    flows: flows
    expected_text: Home
    network_source: proxy
    network_sources:
      - proxy
    ui_snapshots: true
    maestro_permitted: true
    logcat_json: true
    # The current hierarchy strategy replays marked smoke-flow prefixes after the main run.
    # Keep this false for profiles whose actions are not safe to execute more than once.
    allow_prefix_replay: true
    capture:
      settle_ms: 750
      ui_snapshot_delay_ms: 800
      ui_snapshot_min_interval_ms: 800
    proxy:
      listen_host: 0.0.0.0
      port: 8080
      # Empty means discovery mode: capture redacted traffic and list observed hosts.
      # Add exact hosts or wildcard patterns after the first discovery run.
      allowed_hosts: []

